<body>
    <!-- Ambient Background -->
    <canvas id="neural-canvas"></canvas>

    <div class="app-container">
        
        <!-- Login Screen -->
        <div id="auth-screen">
            <div class="auth-card">
                <div class="brand-logo"><i class="fa-solid fa-brain"></i> Neurochat</div>
                <p class="auth-subtext">Connect via the Neural Network.</p>
                
                <div class="input-group">
                    <input type="text" class="auth-input" placeholder="Enter Username" id="username-input" autofocus>
                </div>
                <div class="input-group">
                    <input type="password" class="auth-input" placeholder="Password" value="********">
                </div>
                
                <button class="btn-primary" id="login-btn">Initialize Link</button>
                <div id="login-error" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem;"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img src="https://picsum.photos/seed/me/80/80" alt="My Avatar" class="avatar">
                    <div>
                        <div style="font-weight: 600;" id="current-user-name">Guest</div>
                        <div class="status-text" id="connection-status">Connecting...</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button title="New Chat"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button title="Settings"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
            
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" placeholder="Search connections..." id="search-input">
                </div>
            </div>

            <div class="chat-list" id="chat-list">
                <!-- Chat Items Injected via JS -->
            </div>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-area" id="chat-area">
            <!-- Default Empty State -->
            <div class="empty-state" id="empty-state">
                <i class="fa-solid fa-comments"></i>
                <h2>Welcome to Neurochat</h2>
                <p>Select a connection to start communicating.</p>
            </div>

            <!-- Active Chat View (Hidden initially) -->
            <div id="active-chat-view" class="hidden-view">
                <header class="chat-view-header">
                    <div class="active-chat-info">
                        <button class="back-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <img src="" alt="" class="avatar" id="active-avatar">
                        <div>
                            <div class="chat-name" id="active-name">User</div>
                            <div class="status-text" id="active-status">Offline</div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button><i class="fa-solid fa-phone"></i></button>
                        <button><i class="fa-solid fa-video"></i></button>
                        <button><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                </header>

                <div class="messages-container" id="messages-container">
                    <!-- Messages Injected via JS -->
                </div>
                
                <!-- Typing Indicator -->
                <div class="typing-wrapper">
                    <div class="typing-indicator" id="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <div class="input-area">
                    <button class="input-action-btn"><i class="fa-solid fa-plus"></i></button>
                    <button class="input-action-btn"><i class="fa-regular fa-image"></i></button>
                    <input type="text" class="message-input" placeholder="Type a message..." id="message-input">
                    <button class="input-action-btn"><i class="fa-regular fa-face-smile"></i></button>
                    <button class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Socket.io Client (Must be loaded before script.js) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Custom Scripts -->
    <script src="script.js"></script>
</body>
