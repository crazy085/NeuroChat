<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurochat | Private Messaging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="neural-canvas"></canvas>

    <div class="app-container">
        
        <!-- Login Screen -->
        <div id="auth-screen">
            <div class="auth-card">
                <div class="brand-logo"><i class="fa-solid fa-brain"></i> Neurochat</div>
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="app.switchAuthMode('login')">Login</button>
                    <button class="auth-tab" id="tab-register" onclick="app.switchAuthMode('register')">Register</button>
                </div>
                <div id="auth-message"></div>
                <input type="text" class="auth-input" placeholder="Username" id="username-input">
                <input type="password" class="auth-input" placeholder="Password" id="password-input">
                <button class="btn-primary" id="auth-btn">Connect</button>
            </div>
        </div>

        <!-- New Chat Modal (Hidden by default) -->
        <div id="new-chat-modal" class="modal hidden-modal">
            <div class="modal-content">
                <h3>Start New Chat</h3>
                <p style="color:var(--text-secondary); font-size: 0.9rem; margin-bottom:15px;">Enter a registered username to start a private conversation.</p>
                <input type="text" class="auth-input" placeholder="Search username..." id="new-chat-username">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-secondary" onclick="app.toggleNewChatModal()">Cancel</button>
                    <button class="btn-primary" onclick="app.startNewChat()">Start Chat</button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img src="https://picsum.photos/seed/me/80/80" class="avatar">
                    <div>
                        <div style="font-weight: 600;" id="current-user-name">Guest</div>
                        <div class="status-text online">Online</div>
                    </div>
                </div>
                <div class="header-actions">
                    <!-- New Chat Button -->
                    <button title="New Chat" onclick="app.toggleNewChatModal()"><i class="fa-solid fa-plus"></i></button>
                    <button title="Settings"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
            
            <div class="chat-list" id="chat-list">
                <!-- Dynamic Chats go here -->
                <div class="empty-chats-hint" id="empty-chats-hint">
                    <p>No chats yet.<br>Tap + to start one.</p>
                </div>
            </div>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-area" id="chat-area">
            <div class="empty-state" id="empty-state">
                <i class="fa-solid fa-lock"></i>
                <h2>Private & Secure</h2>
                <p>Select a chat to start messaging.</p>
            </div>

            <div id="active-chat-view" class="hidden-view">
                <header class="chat-view-header">
                    <div class="active-chat-info">
                        <button class="back-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <img src="" class="avatar" id="active-avatar">
                        <div>
                            <div class="chat-name" id="active-name">User</div>
                            <div class="status-text" id="active-status">Online</div>
                        </div>
                    </div>
                </header>

                <div class="messages-container" id="messages-container"></div>
                
                <div class="typing-wrapper">
                    <div class="typing-indicator" id="typing-indicator">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>

                <div class="input-area">
                    <input type="text" class="message-input" placeholder="Type a secure message..." id="message-input">
                    <button class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
